<app-route-shell title="GALLERY" subtitle="// pixel art, posters, scribbles">
  <div class="masonry">
    @for (photo of photos; track photo.src; let i = $index) {
      <button
        appHover
        [scale]="1.02"
        [color]="null"
        hoverFilter="brightness(1.1)"
        type="button"
        class="tile"
        (click)="open(i)"
        [style.aspect-ratio]="photo.width + ' / ' + photo.height"
      >
        <img
          [src]="photo.src"
          [alt]="'Gallery image ' + (i + 1)"
          loading="lazy"
          decoding="async"
        />
      </button>
    }
  </div>
</app-route-shell>
